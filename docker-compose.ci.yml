# Full-Docker stack for Playwright E2E (mirrors Nexus docker-compose.ci.yml).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecri
      POSTGRES_PASSWORD: ecri
      POSTGRES_DB: ecri_ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecri -d ecri_ci"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
    environment:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgres://ecri:ecri@postgres:5432/ecri_ci
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
