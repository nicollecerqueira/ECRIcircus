name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web-staff, web-kds, web-order]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/${{ matrix.app }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/${{ matrix.app }}
      - run: pnpm biome ci .
        working-directory: apps/${{ matrix.app }}
      - run: pnpm build
        working-directory: apps/${{ matrix.app }}

  e2e:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tests/e2e/pnpm-lock.yaml
      - name: Bring up full stack
        run: docker compose -f docker-compose.ci.yml up -d --build
      - run: pnpm install --frozen-lockfile
        working-directory: tests/e2e
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: pnpm test
        working-directory: tests/e2e
      - name: Merge coverage (backend V8 + frontend Istanbul) -> lcov
        run: node tools/merge-coverage.mjs

  sonar:
    runs-on: ubuntu-latest
    needs: e2e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
