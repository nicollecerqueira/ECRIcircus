# Full stack in Docker — one command, no local Node needed:
#   docker compose -f docker-compose.full.yml up -d --build
#
# Trade-off: NO hot reload (images serve a production build). For day-to-day
# development prefer the documented hybrid model (docker-compose.dev.yml + pnpm dev),
# which keeps HMR on the three web apps.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prato
      POSTGRES_PASSWORD: prato
      POSTGRES_DB: prato
    ports:
      - "55432:5432"
    volumes:
      - prato-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prato -d prato"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - prato-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://prato:prato@postgres:5432/prato
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      # Skeleton phase: in-memory stub data (no migrations yet).
      USE_STUB_DATA: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  web-staff:
    build:
      context: ./apps/web-staff
    depends_on:
      - api
    ports:
      - "5173:80"

  web-kds:
    build:
      context: ./apps/web-kds
    depends_on:
      - api
    ports:
      - "5174:80"

  web-order:
    build:
      context: ./apps/web-order
    depends_on:
      - api
    ports:
      - "5175:80"

volumes:
  prato-pgdata:
  prato-redisdata:
