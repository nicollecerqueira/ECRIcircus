sonar.organization=avenirdesenvolvimentos
sonar.projectKey=avenirdesenvolvimentos_prato
sonar.projectName=Prato

# Sources across the four independent apps
sonar.sources=apps/api/src,apps/web-staff/src,apps/web-kds/src,apps/web-order/src
sonar.tests=tests/e2e

# Merged coverage: backend V8 + frontend Istanbul -> one lcov
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Quality gate: 70% coverage on new code (Avenir standard)
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.config.*,**/*.model.ts

sonar.sourceEncoding=UTF-8
