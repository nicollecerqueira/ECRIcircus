server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # REST → api service (same paths the Vite dev proxy serves).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO gateway (mounted on /realtime) — needs the upgrade dance.
  location /realtime {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 7d;
  }

  # Ilustrações: 404 de verdade, fora do fallback de SPA — senão uma arte que
  # falta devolve o index.html com 200 e o <img> baixa a página inteira só para
  # falhar ao decodificar. Estes nomes NÃO têm hash (diferente dos bundles em
  # /assets/), então cache curto com revalidação: com `immutable`, trocar uma
  # arte deixaria quem já visitou preso na versão antiga por dias.
  location /img/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400, must-revalidate";
  }

  # SPA fallback — the router owns every other path.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
