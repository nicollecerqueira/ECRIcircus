# Hybrid local dev: infra in Docker, apps run native with hot reload.
# Weird ports to avoid collisions (Avenir convention).
services:
  postgres:
    image: postgres:16-alpine
    container_name: prato-postgres
    environment:
      POSTGRES_USER: prato
      POSTGRES_PASSWORD: prato
      POSTGRES_DB: prato
    ports:
      - "55432:5432"
    volumes:
      - prato-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prato -d prato"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: prato-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - prato-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prato-pgdata:
  prato-redisdata:
